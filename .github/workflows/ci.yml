name: CI

# Decision D-2026-05-14-01 (docs/rewind_charter.md §11):
# RecoverLand validation runs as runtime QGIS scenarios under
# `scripts/validation/scenarios/`, not as pytest with mocked QGIS.
#
# RL-E3-02: the runtime scenarios are now wired into CI via a headless
# QGIS docker matrix (LTR + latest). The headless runner is
# `scripts/validation/ci_run.py` (mirrors `scenario.run()` in the QGIS
# Python console) and exits non-zero on any FAIL.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 . --count --statistics

  qgis-runtime:
    name: QGIS runtime scenarios (${{ matrix.qgis_tag }})
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis_tag }}
    strategy:
      fail-fast: false
      matrix:
        # The declared support range, both ends and the moving edge:
        #   3.40  -> qgisMinimumVersion, Qt5/PyQt5
        #   4.2.0 -> qgisMaximumVersion in practice, Qt6/PyQt6
        #   latest -> master nightly, catches drift before it ships
        # Until 4.2.0 was added, NO job in this matrix ran on Qt6, so every
        # Qt6-only defect passed CI green (that is how the legend-defer
        # TypeError in snapshot_overlay_session survived a release).
        # Quote every tag: unquoted 3.40 is YAML float 3.4 -> wrong image.
        qgis_tag: ["3.40", "4.2.0", "latest"]
    steps:
      # Check out into a `recoverland` directory so the plugin is importable
      # as the `recoverland` package by the runtime scenarios.
      - uses: actions/checkout@v6
        with:
          path: recoverland

      - name: Run runtime validation scenarios (headless)
        env:
          # Parent of the plugin dir on PYTHONPATH -> `import recoverland.*`.
          PYTHONPATH: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python3 -m recoverland.scripts.validation.ci_run

      # The rewind / restore / review suite. These use the
      # setup(ctx)/run(ctx)/assertions(ctx) contract consumed by
      # scripts/validation/runner.py, which ci_run.py above cannot drive
      # (it expects the other contract, `run() -> dict`).
      #
      # Explicit list rather than a glob: the directory also holds scenarios
      # that do not start (incompatible contract) or whose source assertions
      # point at lines that have since moved. Adding a scenario here means
      # committing to keeping it green — grow the list, never silently drop
      # a name from it.
      - name: Run rewind regression suite (headless)
        working-directory: recoverland
        env:
          PYTHONPATH: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python3 scripts/validation/headless_run.py \
            scripts/validation/scenarios/i2_tracker_suppress.py \
            scripts/validation/scenarios/i3_identity_strength_gate.py \
            scripts/validation/scenarios/i8_rewind_idempotence.py \
            scripts/validation/scenarios/log_format_audit.py \
            scripts/validation/scenarios/p13_fingerprint_portable.py \
            scripts/validation/scenarios/p17_dedup_fid_collision.py \
            scripts/validation/scenarios/p18_makevalid_drift.py \
            scripts/validation/scenarios/rs_update_target_proof.py \
            scripts/validation/scenarios/rvw_cutoff_clock.py \
            scripts/validation/scenarios/rvw_trace_replay.py \
            scripts/validation/scenarios/rw_apply_perf.py \
            scripts/validation/scenarios/rw_dedup_post_trace_edit.py \
            scripts/validation/scenarios/rw_ds_fingerprint_collision.py \
            scripts/validation/scenarios/rw_entity_key_canonical.py \
            scripts/validation/scenarios/rw_fid_recycle_scoping.py \
            scripts/validation/scenarios/rw_fuse_attrs_completeness.py \
            scripts/validation/scenarios/rw_insert_comp_rescue.py \
            scripts/validation/scenarios/rw_multi_hop_navigation.py \
            scripts/validation/scenarios/rw_partial_rewind_resume.py \
            scripts/validation/scenarios/rw_pending_roundtrip.py \
            scripts/validation/scenarios/rw_rewind_active_trace_guard.py \
            scripts/validation/scenarios/rw_rewind_fetch_limit.py \
            scripts/validation/scenarios/rw_rewind_fid_recycle.py \
            scripts/validation/scenarios/rw_trace_lifecycle.py \
            scripts/validation/scenarios/rw_truncated_window_refused.py \
            scripts/validation/scenarios/rw_wq_atomic_enqueue.py
